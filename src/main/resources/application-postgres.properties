# PostgreSQL — perfil por defecto.
# Levantar la base con: docker compose up -d
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iclinic_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

# La estructura la aplica Flyway; Hibernate sólo verifica que coincide con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Sin datos de prueba. Para sembrarlos en local, activar también el perfil `dev`:
#   SPRING_PROFILES_ACTIVE=postgres,dev ./gradlew bootRun
spring.sql.init.mode=never

# ─────────────────────── Aislamiento por tenant ──────────────────────────────
# La aplicacion opera como iclinic_app: sin BYPASSRLS, sin ser propietaria y sin
# DELETE. Sin esto se conectaria como el usuario de la base —superusuario en
# desarrollo— y RLS no se le aplicaria: el aislamiento pareceria activo y no lo
# estaria. ComprobacionDeAislamiento lo verifica al arrancar.
iclinic.tenant.db-role=${ICLINIC_DB_ROLE:iclinic_app}

# Flyway conserva la conexion original: necesita DDL y BYPASSRLS, y con SET ROLE
# iclinic_app no podria ni crear tablas ni rellenar datos.
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iclinic_db}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
