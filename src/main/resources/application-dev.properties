# Perfil `dev`: conveniencias de desarrollo local. Se activa JUNTO a `postgres`:
#   SPRING_PROFILES_ACTIVE=postgres,dev ./gradlew bootRun
#
# No aporta datasource: eso lo da el perfil `postgres`.


# Consola H2 no aplica aquí; para inspeccionar la base usar psql o cualquier cliente:
#   docker exec -it iclinic-postgres psql -U postgres -d iclinic_db

# Registrar el webhook de Telegram automáticamente usando Cloudflare Tunnel.
telegram.webhook.auto-register-enabled=true
telegram.webhook.cloudflare.enabled=true

# Credenciales locales (fichero ignorado por git).
spring.config.import=optional:file:./application-secret.properties
telegram.webhook.seed-token=${telegram.bot.token:}

spring.jpa.show-sql=true

# Datos de prueba por Flyway, no por spring.sql.init: la aplicacion opera como
# iclinic_app y sus conexiones estan sujetas a RLS, que rechaza un INSERT sin
# tenant fijado. Flyway usa la conexion privilegiada.
spring.flyway.locations=classpath:db/migration,classpath:db/seed-flyway
