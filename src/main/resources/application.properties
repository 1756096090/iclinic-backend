spring.application.name=iclinic-backend

# ─────────────────────────────────────────────────────────────────────────────
# PERFILES
#
#   postgres      → PostgreSQL de docker-compose + Flyway   (por defecto)
#   postgres,dev  → lo anterior + datos de prueba (db/seed/dev-seed.sql)
#
# El perfil `h2` se ELIMINO. No es que divergiera del esquema real: es que daba
# confianza falsa. H2 no soporta EXCLUDE, ni tipos rango, ni RLS, ni FK compuestas
# con la misma semantica, asi que a partir de este bloque una prueba verde en H2
# no dice nada sobre si el constraint existe en produccion, que es el peor estado
# posible para una suite.
#   Local:  docker compose up -d postgres
#   Tests:  Testcontainers (AbstractPostgresIT)
# ─────────────────────────────────────────────────────────────────────────────
spring.profiles.active=postgres

# JPA/Hibernate
# ddl-auto=validate: con `postgres` la estructura vive en migraciones Flyway
# (db/migration) y Hibernate solo comprueba que coincide con las entidades.
# Los perfiles `h2` y `test` lo sobrescriben a create-drop.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# El dialecto se deduce de la conexión. No fijarlo aquí: hacerlo obligaba a H2Dialect
# incluso corriendo contra PostgreSQL.

# Mapear los enums de Java a varchar y no a tipos enum nativos de PostgreSQL,
# para que añadir un valor no exija ALTER TYPE.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Telegram Bot Configuration
# El token NUNCA debe versionarse. Se lee de la variable de entorno TELEGRAM_BOT_TOKEN.
# IMPORTANTE: el token previo fue expuesto en el repositorio; rotarlo en BotFather.
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.webhook.path=/api/v1/crm/webhooks/telegram
# URL base pública del servidor para registrar el webhook en Telegram al arrancar.
# Ejemplo con ngrok:   telegram.webhook.base-url=https://xxxx.ngrok-free.app
# Ejemplo cloudflare: telegram.webhook.base-url=https://xxxx.trycloudflare.com
# Dejar vacío para deshabilitar el auto-registro al arrancar.
telegram.webhook.base-url=
telegram.webhook.auto-register-enabled=false
telegram.webhook.auto-register.max-attempts=6
telegram.webhook.auto-register.retry-delay-seconds=15
telegram.webhook.auto-register.initial-delay-seconds=8
telegram.webhook.cloudflare.enabled=false
telegram.webhook.cloudflare.command=cloudflared
telegram.webhook.cloudflare.local-port=${server.port:8080}
telegram.webhook.cloudflare.startup-timeout-seconds=25

# Secret de cifrado para AES-256/GCM (min 32 chars). Se lee de la variable de entorno ENCRYPTION_SECRET_KEY.
# El valor por defecto es SOLO para desarrollo local; en prod debe inyectarse por entorno.
encryption.secret-key=${ENCRYPTION_SECRET_KEY:iclinic-dev-secret-key-32-chars!!}

# Keycloak. La identidad la emite Keycloak; esta aplicacion solo valida tokens.
# El issuer se usa para descubrir las claves publicas (JWKS) al arrancar.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/iclinic}
# Cliente propio. Se usa para DOS cosas distintas:
#   - validar que el `aud` del token es este, y no otro cliente del mismo realm
#   - leer los roles de resource_access.<cliente>.roles
iclinic.keycloak.client-id=${KEYCLOAK_CLIENT_ID:iclinic-api}

# Migración multitenant (Fase B). Backfill idempotente de company_memberships al arrancar.
# Desactivar (false) una vez completada la Fase D del plan SaaS.
iclinic.multitenancy.backfill-on-startup=true

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
