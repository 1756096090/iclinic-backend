# Perfil `h2` — arranque local rápido SIN Docker.
#
#   SPRING_PROFILES_ACTIVE=h2 ./gradlew bootRun
#
# OJO, no es equivalente a producción:
#   - El esquema lo genera Hibernate desde las entidades (ddl-auto=create-drop),
#     NO las migraciones de Flyway. Puede diverger de PostgreSQL sin avisar:
#     un error en una migración no se detecta aquí.
#   - Los datos se pierden en cada reinicio.
#   - H2 no soporta cosas que sí usa producción (p. ej. FOR UPDATE SKIP LOCKED,
#     índices únicos parciales).
#
# Úsalo para levantar la app rápido. La verdad del esquema es PostgreSQL:
# antes de dar algo por bueno, pruébalo con el perfil `postgres`.

spring.datasource.url=jdbc:h2:mem:iclinicdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Único perfil de ejecución donde Hibernate genera DDL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Las migraciones son SQL de PostgreSQL; no se aplican sobre H2.
spring.flyway.enabled=false

# Datos de prueba: Hibernate carga import.sql tras crear el esquema.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Consola web de H2: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:iclinicdb   usuario: sa   sin contraseña
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

# Registrar el webhook de Telegram automáticamente vía Cloudflare Tunnel.
telegram.webhook.auto-register-enabled=true
telegram.webhook.cloudflare.enabled=true

# Credenciales locales (fichero ignorado por git).
spring.config.import=optional:file:./application-secret.properties
telegram.webhook.seed-token=${telegram.bot.token:}
