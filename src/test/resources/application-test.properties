# Perfil `test`: H2 en memoria. Es el UNICO perfil donde Hibernate genera DDL,
# para que la suite corra sin PostgreSQL levantado.
spring.datasource.url=jdbc:h2:mem:iclinicdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Las migraciones son PostgreSQL; no se aplican sobre H2.
spring.flyway.enabled=false

# Datos de prueba: import.sql lo carga Hibernate tras crear el esquema.
spring.sql.init.mode=never

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

telegram.webhook.auto-register-enabled=false
telegram.webhook.cloudflare.enabled=false
