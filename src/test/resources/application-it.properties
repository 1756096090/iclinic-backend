# Perfil `it`: tests de integración contra PostgreSQL real (Testcontainers).
#
# Sustituye al antiguo perfil `test`, que corría sobre H2. H2 no soporta EXCLUDE,
# ni tipos rango, ni RLS, ni FK compuestas con la misma semántica: a partir del
# bloque de aislamiento, una prueba verde en H2 no dice nada sobre si el
# constraint existe en producción.
#
# El datasource NO se configura aquí: lo inyecta @ServiceConnection desde
# AbstractPostgresIT.

# El esquema lo aplica Flyway, igual que en producción. Es la diferencia que
# importa: aquí sí se ejercitan las migraciones.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.defer-datasource-initialization=false

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

# Nada de salir a la red desde un test.
telegram.webhook.auto-register-enabled=false
telegram.webhook.cloudflare.enabled=false

# Keycloak: las clases que lo necesitan levantan su propio contenedor y
# sobrescriben esto con @DynamicPropertySource.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/iclinic
iclinic.keycloak.client-id=iclinic-api

# Datos de prueba por Flyway, no por spring.sql.init: la aplicacion opera como
# iclinic_app y sus conexiones estan sujetas a RLS, que rechaza un INSERT sin
# tenant fijado. Flyway usa la conexion privilegiada.
spring.flyway.locations=classpath:db/migration,classpath:db/seed-flyway
